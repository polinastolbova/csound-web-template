<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11110f" />
  <title>My Sound Project</title>

  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #e9e5dc;
      background: #11110f;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #11110f;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    aside {
      padding: 32px 24px;
      border-right: 1px solid #34332e;
    }

    .brand {
      font-size: 12px;
      letter-spacing: 0.18em;
      color: #d3a778;
      margin-bottom: 48px;
    }

    #chapters {
      display: grid;
      gap: 8px;
    }

    .chapter {
      text-align: left;
      padding: 10px 0;
      border: 0;
      background: transparent;
      color: #88867e;
    }

    .chapter.active,
    .chapter:hover {
      color: #e9e5dc;
    }

    main {
      padding: 8vh 8vw 140px;
      max-width: 1100px;
    }

    .eyebrow {
      color: #d3a778;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 24px 0 16px;
      font-size: clamp(42px, 7vw, 84px);
      font-weight: 400;
      line-height: 1.05;
    }

    .subtitle {
      color: #aaa69c;
      font-size: 18px;
    }

    .description {
      max-width: 620px;
      margin-top: 32px;
      color: #aaa69c;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 40px;
    }

    .action {
      padding: 13px 20px;
      border: 1px solid #d3a778;
      background: transparent;
      color: #e9e5dc;
    }

    .action.primary {
      background: #d3a778;
      color: #11110f;
    }

    .player {
      position: fixed;
      bottom: 0;
      left: 220px;
      right: 0;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 32px;
      background: #1b1b18;
      border-top: 1px solid #34332e;
    }

    .player button {
      border: 0;
      background: transparent;
      color: #e9e5dc;
      font-size: 18px;
    }

    #status {
      color: #aaa69c;
      font-size: 12px;
    }

    @media (max-width: 620px) {
      .layout {
        grid-template-columns: 1fr;
      }

      aside {
        padding: 20px;
        border-right: 0;
        border-bottom: 1px solid #34332e;
      }

      .brand {
        margin-bottom: 16px;
      }

      #chapters {
        display: flex;
        overflow-x: auto;
        gap: 20px;
      }

      .chapter {
        white-space: nowrap;
      }

      main {
        padding: 48px 24px 140px;
      }

      .player {
        left: 0;
        padding: 16px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside>
      <div class="brand" id="project-title">MY SOUND PROJECT</div>
      <nav id="chapters"></nav>
    </aside>

    <main>
      <div class="eyebrow" id="counter">COMPOSITION 01</div>
      <h1 id="composition-title">My Sound Project</h1>
      <div class="subtitle" id="composition-subtitle">
        An interactive listening experience
      </div>

      <p class="description" id="composition-description">
        A generative sound environment created with Csound.
      </p>

      <div class="actions">
        <button class="action primary" id="play-main">Begin listening</button>
        <button class="action" id="next-main">Next composition</button>
      </div>

      <p id="status">Ready to listen</p>
    </main>
  </div>

  <footer class="player">
    <button id="prev" aria-label="Previous composition">←</button>
    <button id="play" aria-label="Play or stop">▶</button>
    <button id="next" aria-label="Next composition">→</button>
    <span id="player-title">Composition 01</span>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
